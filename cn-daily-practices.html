<!DOCTYPE html>

<html>


<head>
  <title>Daily Practices</title>

  <link rel="stylesheet" href="header-styles.css">
  <link rel="stylesheet" href="cliff-notes-styles.css">

  <style>
    
    #searchBox:focus {
      outline: none;
      border-color: #b9a7e6;
      box-shadow: 0 0 5px rgba(180, 150, 255, 0.4);
    }

    #dailyPracticesList {
      text-align: left;
      column-count: 2;
      column-gap: 20px;
      padding-left: 20px;
    }

    #dailyPracticesList li {
      text-align: left;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div id="header-placeholder"></div>

  <div class="container">

    <img src="cliff-notes-images/daily-practices.png">
    <h1>Daily Practices</h1>
    <div class="subtitle">What is my heart calling me to do right now? ✨</div>

    <input type="text" id="searchBox" placeholder="What am I looking for..."
      style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ddd;">

    <ul id="dailyPracticesList"></ul>

  </div>

  <script>

    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      });

    let dailyPracticesData = [];
    let currentIndex = 0;

    fetch('cn-daily-practices.json')
      .then(response => response.json())
      .then(data => {
        dailyPracticesData = data["items"];
        buildList();
      });

    function buildList() {
      const list = document.getElementById("dailyPracticesList");
      list.innerHTML = "";

      dailyPracticesData.forEach((item, index) => {
        const li = document.createElement("li");

        // 👇 store searchable text (label + tags)
        const searchableText = (
          item.label + " " + (item.tags || []).join(" ")
        ).toLowerCase();

        li.setAttribute("data-search", searchableText);

        li.innerHTML = `
          <a href="#" onclick="openModal(${index})">
            ${item.label}
          </a>
       `;
        list.appendChild(li);
      });
    }


    function openModal(index) {
      currentIndex = index;
      showPage();
      document.getElementById("modal").style.display = "block";
    }

    function showPage() {
      const item = dailyPracticesData[currentIndex];

      if (item.type === "PDF") {
        document.getElementById("modal-body").innerHTML =
          `<iframe src="${item.src1}" width="100%" height="600px"></iframe>`;
      }

      else if (item.type === "image") {
        let html = `<img src="${item.src1}" style="max-width:100%; margin-bottom:10px;">`;

        if (item.src2) {
          html += `<img src="${item.src2}" style="max-width:100%;">`;
        }
        document.getElementById("modal-body").innerHTML = html;
      }
      else {
        document.getElementById("modal-body").innerHTML =
          `<p>Oops! Something went wrong loading this resource.</p>`;
      }
    }

    function nextPage() {
      if (currentIndex < dailyPracticesData.length - 1) {
        currentIndex++;
        showPage();
      }
    }

    function prevPage() {
      if (currentIndex > 0) {
        currentIndex--;
        showPage();
      }
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("modal").addEventListener("click", function (e) {
        if (e.target === this) {
          closeModal();
        }
      });
    });

  </script>

  <script id="kx8c2t">
    const searchBox = document.getElementById("searchBox");
    const items = document.querySelectorAll("#dailyPracticesList li");

    searchBox.addEventListener("keyup", function () {
      const searchText = searchBox.value.toLowerCase();

      const items = document.querySelectorAll("#dailyPracticesList li");

      items.forEach(function (item) {
        // const text = item.textContent.toLowerCase();
        const text = item.getAttribute("data-search");
        item.style.display = text.includes(searchText) ? "" : "none";
      });
    });

  </script>

  <script src="app.js"></script>

  <div id="modal" class="modal">
    <div class="modal-content">

      <span class="close" onclick="closeModal()">&times;</span>

      <div id="modal-body"></div>

      <div class="nav-buttons">
        <button onclick="prevPage()">⬅️ Previous</button>
        <button onclick="nextPage()">Next ➡️</button>
      </div>

    </div>
  </div>

</body>

</html>
