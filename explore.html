<head>
  <title>Explore</title>

  <link rel="stylesheet" href="header-styles.css">

  <style>
    .explore-banner h1 {
      position: relative;
      color: #5c4b7d;
      font-weight: 600;
      font-size: 38px;
      text-shadow:
        0 2px 6px rgba(255, 255, 255, 0.9),
        0 0 8px rgba(92, 75, 125, 0.2);
    }

    .explore-banner img {
      width: 100px;
      margin-bottom: 10px;
    }

    .explore-banner {
      background-image: url('explore-images/explore-header.jpg');
      /* <-- your image path */
      background-size: cover;
      background-position: center;

      padding: 40px 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      text-align: center;

      position: relative;
    }

    /* Soft overlay so text is readable */
    .explore-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.35);
      /* soft white glow */
      border-radius: 16px;
    }


    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      background: #f6f3f9;
    }

    select {
      font-size: 18px;
      padding: 8px;
    }

    label {
      font-size: 18px;
    }

    button {
      font-size: 18px;
      padding: 10px 16px;
    }

    input {
      font-size: 18px;
    }

    select,
    input {
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 30px auto;
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #5c4b7d;
    }

    body {
      background: linear-gradient(180deg, #f6f3f9, #ffffff);
    }

    .card {
      padding: 15px;
      border-radius: 12px;
      background: #ffffff;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .button {
      display: block;
      margin: 20px auto;
      padding: 10px 14px;
      background: #e6d9f5;
      border: none;
      border-radius: 10px;
      cursor: pointer;

    }

    .button:hover {
      background: #d6c6f0;
      box-shadow: 0 0 10px rgba(180, 150, 255, 0.4);
    }

    .home-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 12px 20px;
      font-size: 16px;
      background: #dcd0f0;
      border-radius: 10px;
      text-decoration: none;
      color: #5c4b7d;
    }

    .container img {
      width: 120px;
      margin-bottom: 10px;
    }

   /* Remove underline from all links */
    a {
      text-decoration: none;
    }

    @keyframes gentleGlow {
      0% {
        box-shadow: 0 0 10px rgba(200, 170, 255, 0.25);
      }

      50% {
        box-shadow: 0 0 16px rgba(200, 170, 255, 0.45);
      }

      100% {
        box-shadow: 0 0 10px rgba(200, 170, 255, 0.25);
      }
    }


    .highlight {
      background-color: #e6d9f5;
      border-radius: 4px;
      padding: 1px 3px;
    }
  

    @keyframes popIn {
      from {
        transform: scale(0.9);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }


   
  </style>
</head>

<body>

  <div id="header-placeholder"></div>

  <div class="container">

    <div class="explore-banner">
      <h1>Explore</h1>
    </div>

     <a href="explore-meetings.html">
        <button class="button">🔍 Explore Meetings</button>
     </a>

     <a href="explore-cliff-notes.html">
        <button class="button">📖 Explore Cliff Notes</button>
     </a>

     <a href="explore-quotations.html">
        <button class="button">💬 Explore Quotations</button>
     </a>

     <a href="explore-affirmations.html">
        <button class="button">🌷 Explore Affirmations</button>
     </a>
     
     

  </div>

</body>

<script src="app.js"></script>

<script>
 fetch('header.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('header-placeholder').innerHTML = data;
    });
</script>
