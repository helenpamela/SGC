<!DOCTYPE html>

<html>


<head>
  <title>Resources</title>

  <link rel="stylesheet" href="header-styles.css">
  <link rel="stylesheet" href="cliff-notes-styles.css">

  <style>
    
    #resourcesList {
      text-align: left;
      column-count: 2;
      column-gap: 20px;
      padding-left: 20px;
    }

    #resourcesList li {
      text-align: left;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div id="header-placeholder"></div>

  <div class="container">

    <img src="cliff-notes-images/resources.png">
    <h1>Resources</h1>
    <div class="subtitle">What resources would be helpful for me? ✨</div>

    <ul id="resourcesList"></ul>

  </div>

  <script>

    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      });


    let resourcesData = [];
    let currentIndex = 0;

    fetch('cn-resource-sections.json')
      .then(response => response.json())
      .then(data => {
        resourcesData = data["items"];
        buildList();
      });

    function buildList() {
      const list = document.getElementById("resourcesList");
      list.innerHTML = "";

      resourcesData.forEach((item, index) => {
        const li = document.createElement("li");

        li.innerHTML = `
           <a href="#" onclick="openModal(${index})">
        ${item.label}
      </a>
    `;

        list.appendChild(li);
      });
    }

    function openModal(index) {
      currentIndex = index;
      showPage();
      document.getElementById("modal").style.display = "block";
    }

    function showPage() {
      const item = resourcesData[currentIndex];

      if (item.type === "PDF") {
        document.getElementById("modal-body").innerHTML =
          `<iframe src="${item.src1}" width="100%" height="600px"></iframe>`;
      }

      else if (item.type === "image") {
        let html = `<img src="${item.src1}" style="max-width:100%; margin-bottom:10px;">`;

        if (item.src2) {
          html += `<img src="${item.src2}" style="max-width:100%;">`;
        }
        document.getElementById("modal-body").innerHTML = html;
      }
      else {
        document.getElementById("modal-body").innerHTML =
          `<p>Oops! Something went wrong loading this resource.</p>`;
      }

    }

    function nextPage() {
      if (currentIndex < resourcesData.length - 1) {
        currentIndex++;
        showPage();
      }
    }
    function prevPage() {
      if (currentIndex > 0) {
        currentIndex--;
        showPage();
      }
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("modal").addEventListener("click", function (e) {
        if (e.target === this) {
          closeModal();
        }
      });
    });


  </script>

  <script src="app.js"></script>

  <div id="modal" class="modal">
    <div class="modal-content">

      <span class="close" onclick="closeModal()">&times;</span>

      <div id="modal-body"></div>

      <div class="nav-buttons">
        <button onclick="prevPage()">⬅️ Previous</button>
        <button onclick="nextPage()">Next ➡️</button>
      </div>

    </div>
  </div>



</body>

</html>
