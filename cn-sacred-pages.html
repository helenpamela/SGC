<!DOCTYPE html>

<html>


<head>
  <title>Sacred Pages</title>

  <link rel="stylesheet" href="header-styles.css">
  <link rel="stylesheet" href="cliff-notes-styles.css">

  <style>

    .sacred-banner h1 {
      position: relative;
      color: #5c4b7d;
      font-weight: 600;
      font-size: 38px;
      text-shadow:
        0 2px 6px rgba(255, 255, 255, 0.9),
        0 0 8px rgba(92, 75, 125, 0.2);
    }

    .sacred-banner img {
      width: 100px;
      margin-bottom: 10px;
    }

    .sacred-banner {
      background-image: url('cliff-notes-images/sacred-pages.jpg');

      /* <-- your image path */
      background-size: cover;
      background-position: center;

      padding: 40px 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      text-align: center;

      position: relative;
    }

    /* Soft overlay so text is readable */
    .sacred-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.35);
      /* soft white glow */
      border-radius: 16px;
    }

    #SacredPagesList {
      text-align: left;
      column-count: 2;
      column-gap: 20px;
      padding-left: 20px;
    }

    #SacredPagesList li {
      text-align: left;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div id="header-placeholder"></div>

  <div class="container">

    <div class="sacred-banner">
      <h1>Sacred Pages</h1>
    </div>

    <p style="color:#6a5d8f; margin: 10px 0 25px 0;">
      A collection of pages we return to again and again—
      reminders of who we are and what matters most.
    </p>

    <ul id="SacredPagesList"> </ul>

  </div>

  <script>

    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      });

    let SacredPagesData = [];
    let currentIndex = 0;

    fetch('cn-sacred-pages.json')
      .then(response => response.json())
      .then(data => {
        SacredPagesData = data["items"];
        buildList();
      });

    function buildList() {
      const list = document.getElementById("SacredPagesList");
      list.innerHTML = "";

      SacredPagesData.forEach((item, index) => {
        const li = document.createElement("li");

        li.innerHTML = `
          <a href="#" onclick="openModal(${index})">
            ${item.label}
          </a>
        `;

        list.appendChild(li);
      });
    }

    function openModal(index) {
      currentIndex = index;
      showPage();
      document.getElementById("modal").style.display = "block";
    }

    function showPage() {
      const item = SacredPagesData[currentIndex];

      if (item.type === "PDF") {
        document.getElementById("modal-body").innerHTML =
          `<iframe src="${item.src1}" width="100%" height="600px"></iframe>`;
      }

      else if (item.type === "image") {
        let html = `<img src="${item.src1}" style="max-width:100%; margin-bottom:10px;">`;

        if (item.src2) {
          html += `<img src="${item.src2}" style="max-width:100%;">`;
        }
        document.getElementById("modal-body").innerHTML = html;
      }
      else {
        document.getElementById("modal-body").innerHTML =
          `<p>Oops! Something went wrong loading this resource.</p>`;
      }
    }

    function nextPage() {
      if (currentIndex < SacredPagesData.length - 1) {
        currentIndex++;
        showPage();
      }
    }
    function prevPage() {
      if (currentIndex > 0) {
        currentIndex--;
        showPage();
      }
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("modal").addEventListener("click", function (e) {
        if (e.target === this) {
          closeModal();
        }
      });
    });

  </script>

  <script src="app.js"></script>

  <div id="modal" class="modal">
    <div class="modal-content">

      <span class="close" onclick="closeModal()">&times;</span>

      <div id="modal-body"></div>

      <div class="nav-buttons">
        <button onclick="prevPage()">⬅️ Previous</button>
        <button onclick="nextPage()">Next ➡️</button>
      </div>

    </div>
  </div>

</body>

</html>
